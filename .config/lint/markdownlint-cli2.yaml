# markdownlint-cli2 project config.
# Globs are the single source of truth for CI (`docs-shell.yml`) and
# `make docs-shell`. Keep workflow `paths:` filters aligned with these
# root files so edits still trigger the lint job.
#
# Intentionally not linted yet: `.github/**/*.md` templates (separate scope).

config:
  MD013: false # Line length (legitimate exception for docs with long tables/URIs)
  MD024:
    siblings_only: true # Allow parallel headers like "Tasks" under different milestones
  MD032: false # Blanks around lists
  MD033: false # Inline HTML (needed for badge/br spacing tags)
  MD036: false # Emphasis used instead of a heading (used for dates/updates)
  MD060: false # Table column style (prevent table re-formatting noise)

globs:
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - SECURITY.md
  - docs/**/*.md
  - scripts/**/*.md
  - .cursor/rules/**/*.mdc
