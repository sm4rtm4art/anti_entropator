[package]
name = "anti_entropator"
version = "0.2.0"
edition = "2021"
description = "A local data lakehouse for file organization - transform chaos into queryable order"
authors = ["Martin"]
license = "MIT"
repository = "https://github.com/sm4rtm4art/anti_entropator"
keywords = ["file-organization", "lakehouse", "iceberg", "datafusion", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "^1.0.102"
thiserror = "2.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }
rustyline = "17"

# Storage (unified I/O via OpenDAL)
opendal = { version = "0.55", features = ["services-s3"] }
object_store_opendal = "0.55"
object_store = { version = "0.12", default-features = false }

# Lakehouse
iceberg = "0.8"
iceberg-catalog-rest = "0.8"
datafusion = "51"
iceberg-datafusion = "0.8"
arrow = { version = "57", features = ["prettyprint"] }
parquet = { version = "57", features = ["zstd"] }

# File Processing & Crypto
sha2 = "0.10"
hmac = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
infer = "0.19"
walkdir = "2"

# HTTP client (for doctor checks)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif = "0.17"
console = "0.16"
comfy-table = "7"
humansize = "2"
regex = "1"
once_cell = "1"
directories = "6"
url = "2"

# Platform-specific (macOS xattrs)
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
test-case = "3"
tokio-test = "0.4"
opendal = { version = "0.55", features = ["services-memory"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "anti_entropator"
path = "src/main.rs"

