name: Setup Rust Toolchain and Cache
description: Install pinned Rust toolchain and restore bounded Cargo caches.

inputs:
  components:
    description: "Comma-separated rustup components (e.g. rustfmt,clippy)"
    required: false
    default: ""
  targets:
    description: "Comma-separated rustup targets (e.g. x86_64-unknown-linux-gnu)"
    required: false
    default: ""
  cache-key-suffix:
    description: "Cache key suffix to isolate workflows/jobs"
    required: false
    default: "default"
  cache-enabled:
    description: "Whether to restore/save Cargo cache entries"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12 (no version tag)
      with:
        toolchain: stable
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Each job restores only its own suffix-scoped cache. The previous broad
    # `${{ runner.os }}-cargo-` fallback let unrelated jobs (e.g. Cargo Audit)
    # restore a multi-GB cache they did not need and exhaust runner disk.
    - name: Cache cargo
      if: inputs.cache-enabled == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ inputs.cache-key-suffix }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.cache-key-suffix }}-
