name: Rust Quality

on:
  workflow_call:
    inputs:
      run_lint:
        required: false
        type: boolean
        default: true
      run_test:
        required: false
        type: boolean
        default: true
      run_audit:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: inputs.run_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key-suffix: quality-lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  test:
    name: Build & Test
    if: inputs.run_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: quality-test

      - name: Run tests
        run: cargo test --all-features

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  audit:
    name: Cargo Audit
    if: inputs.run_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: quality-audit
          cache-enabled: "false"

      - name: Install cargo-audit
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
