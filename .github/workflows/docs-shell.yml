name: Docs & Shell Quality

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docs & Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Install typos, shellcheck, shfmt
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: typos,shellcheck,shfmt

      - name: Run typos check
        run: typos --config .config/lint/typos.toml

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 --config .config/lint/markdownlint-cli2.yaml "README.md" "AGENTS.md" "CHANGELOG.md" "docs/**/*.md" ".cursor/rules/**/*.mdc"

      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*

      - name: Run shfmt check
        run: shfmt -i 4 -d scripts/ scripts/hooks/
