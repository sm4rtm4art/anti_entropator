name: Docs & Shell Quality

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docs & Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Install typos, shellcheck, shfmt
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: typos,shellcheck,shfmt

      - name: Run typos check
        run: typos --config .config/lint/typos.toml

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 --config .config/lint/markdownlint-cli2.yaml "README.md" "AGENTS.md" "CHANGELOG.md" "docs/**/*.md" ".cursor/rules/**/*.mdc"

      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*

      - name: Run shfmt check
        run: shfmt -i 4 -d scripts/ scripts/hooks/
