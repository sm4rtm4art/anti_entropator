name: Docs & Shell Quality

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-shell.yml'
      - '.cursor/rules/**'
      - '.config/lint/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docs & Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned action (clears zizmor adhoc-packages #71 vs npm install -g).
      # Empty `globs` overrides the action default so file set comes only from
      # `.config/lint/markdownlint-cli2.yaml` `globs:`.
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .config/lint/markdownlint-cli2.yaml
          globs: ""

      - name: Install typos, shellcheck, shfmt
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: typos,shellcheck,shfmt

      - name: Run typos check
        run: typos --config .config/lint/typos.toml

      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*

      - name: Run shfmt check
        run: shfmt -i 4 -d scripts/ scripts/hooks/
