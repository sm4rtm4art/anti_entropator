name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_multiarch:
        description: "Run the multi-arch Buildx dry-run (linux/amd64 + linux/arm64)"
        type: boolean
        default: false
      run_delivery_smoke:
        description: "Run delivery simulation smoke (ephemeral green slot)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: sm4rtm4art/anti_entropator

jobs:
  quality:
    name: Quality
    permissions:
      contents: read
    uses: ./.github/workflows/rust-quality.yml
    with:
      run_lint: true
      run_test: true
      run_audit: true

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [quality]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - native build
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          # macOS ARM (Apple Silicon) - native on macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Ubuntu runners ran out of disk during Setup Rust in release dry-run
      # 27274110998 (attempt 1). Same mitigation as rust-quality.yml/ci.yml;
      # Linux-only because the macOS matrix leg has none of these paths.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: release-binaries-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../anti_entropator-${{ matrix.target }}.tar.gz anti_entropator
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anti_entropator-${{ matrix.target }}
          path: anti_entropator-${{ matrix.target }}.tar.gz

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  verify-container:
    name: Verify Container Image
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Select canonical tag
        id: canonical
        env:
          TAGS_OUTPUT: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          canonical_tag="$(printf '%s\n' "$TAGS_OUTPUT" | sed -n '1p')"
          if [ -z "${canonical_tag}" ]; then
            echo "Unable to determine canonical image tag from metadata-action output" >&2
            exit 1
          fi
          echo "tag=${canonical_tag}" >> "$GITHUB_OUTPUT"

      - name: Verify image security posture
        uses: ./.github/actions/container-verify
        with:
          image-tag: ${{ steps.canonical.outputs.tag }}
          severity: HIGH,CRITICAL
          artifact-name: trivy-image-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified image
        env:
          CANONICAL_TAG: ${{ steps.canonical.outputs.tag }}
        run: docker save "$CANONICAL_TAG" -o verified-image.tar

      # Handoff artifacts are named by run_id only (no run_attempt) so a
      # "re-run failed jobs" release attempt can still download artifacts
      # produced by an earlier attempt; overwrite covers full re-runs. With
      # retention-days: 1, re-runs more than a day later rebuild from scratch
      # (acceptable, documented).
      - name: Upload verified image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-image-${{ github.run_id }}
          path: verified-image.tar
          if-no-files-found: error
          overwrite: true
          # Short-lived handoff artifact; not a release deliverable.
          retention-days: 1

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Runs on dispatch AND tag pushes so the load/re-tag/save handoff is exercised
  # by the dry run. Holds only contents:read; never logs into or pushes to GHCR.
  prepare-container-publish:
    name: Prepare Container Publish
    needs: [verify-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download verified image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-image-${{ github.run_id }}
          path: .

      - name: Load verified image
        id: load
        shell: bash
        run: |
          loaded="$(docker load -i verified-image.tar | sed -n 's/^Loaded image: //p' | head -n1)"
          if [ -z "${loaded}" ]; then
            echo "Could not determine the loaded image reference" >&2
            exit 1
          fi
          echo "image=${loaded}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Re-tag and save publish image
        # Re-tags the exact verified image (loaded reference) onto every GHCR tag,
        # then saves the multi-tag tarball plus an explicit tag manifest. The
        # manifest (not local `docker images`) is the source of truth for push,
        # so stale repo tags on a self-hosted runner can never be published.
        env:
          LOADED_IMAGE: ${{ steps.load.outputs.image }}
          TAGS_OUTPUT: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          publish_tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$LOADED_IMAGE" "$tag"
            publish_tags+=("$tag")
          done <<< "$TAGS_OUTPUT"
          if [ "${#publish_tags[@]}" -eq 0 ]; then
            echo "No publish tags resolved from metadata-action output" >&2
            exit 1
          fi
          docker save "${publish_tags[@]}" -o publish-image.tar
          printf '%s\n' "${publish_tags[@]}" > publish-tags.txt

      # run_id-only name + overwrite: see the verified-image upload note.
      - name: Upload publish image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-image-${{ github.run_id }}
          path: |
            publish-image.tar
            publish-tags.txt
          if-no-files-found: error
          overwrite: true
          # Short-lived handoff artifact; not a release deliverable.
          retention-days: 1

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # The only job with packages:write, and the only publish-effecting job.
  # Guarded to real tag pushes; needs binaries so GHCR is never updated unless
  # binaries also built. Pushes exactly the tags loaded from the verified tarball.
  push-container:
    name: Push Container Image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-container-publish, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download publish image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-image-${{ github.run_id }}
          path: .

      - name: Load publish image
        run: docker load -i publish-image.tar

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest image tags
        # Pushes only the tags recorded in the publish manifest produced alongside
        # the verified tarball. The pushed image is byte-identical to the scanned
        # one, and no stale local tags can leak in on self-hosted runners.
        shell: bash
        run: |
          if [ ! -f publish-tags.txt ]; then
            echo "publish-tags.txt manifest not found next to publish-image.tar" >&2
            exit 1
          fi
          pushed=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
            pushed=$((pushed + 1))
          done < publish-tags.txt
          if [ "${pushed}" -eq 0 ]; then
            echo "No tags listed in publish-tags.txt to push" >&2
            exit 1
          fi

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [push-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download binary artifacts
        # Only the binary tarballs are release deliverables; skip the large
        # image-handoff tarballs and Trivy evidence artifacts.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: anti_entropator-*

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Opt-in delivery smoke (S5-C Slice D). Reuses the local delivery helper
  # against an ephemeral green slot with generated non-secret credentials.
  # Dispatch-only and non-publishing; this validates the rollout simulation
  # path without changing release/tag behavior.
  delivery-smoke:
    name: Delivery Smoke Simulation
    if: github.event_name == 'workflow_dispatch' && inputs.run_delivery_smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Capture disk headroom before build
        run: df -h / | tee disk-before-delivery-smoke.txt

      - name: Build candidate image
        id: build_image
        env:
          CANDIDATE_IMAGE: anti_entropator:delivery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          start="$(date +%s)"
          docker build --pull -t "$CANDIDATE_IMAGE" .
          end="$(date +%s)"
          duration="$((end - start))"
          echo "candidate_image=${CANDIDATE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_duration_seconds=${duration}" >> "$GITHUB_OUTPUT"
          df -h / | tee disk-after-delivery-build.txt

      - name: Run delivery simulation smoke
        id: delivery_smoke
        env:
          CANDIDATE_IMAGE: ${{ steps.build_image.outputs.candidate_image }}
        run: |
          start="$(date +%s)"
          ./scripts/delivery-sim.sh deploy green "$CANDIDATE_IMAGE" --ephemeral-env
          end="$(date +%s)"
          duration="$((end - start))"
          echo "smoke_duration_seconds=${duration}" >> "$GITHUB_OUTPUT"

      - name: Capture delivery evidence
        if: always()
        run: |
          project="anti_entropator_green"
          export DELIVERY_SLOT=green
          export ANTI_BIND_HOST=127.0.0.1
          export RUSTFS_API_PORT=9200
          export RUSTFS_CONSOLE_PORT=9210
          export POSTGRES_PORT=9300
          export LAKEKEEPER_PORT=9100
          export RUSTFS_ACCESS_KEY=delivery-evidence-access
          export RUSTFS_SECRET_KEY=delivery-evidence-secret
          export POSTGRES_USER=lakekeeper
          export POSTGRES_DB=lakekeeper
          export POSTGRES_PASSWORD=delivery-evidence-postgres
          export LAKEKEEPER_PG_ENCRYPTION_KEY=delivery-evidence-lakekeeper
          export LAKEKEEPER_AUTHZ_BACKEND=allowall
          docker compose -p "$project" -f docker-compose.yml -f docker-compose.delivery.yml ps > delivery-compose-ps.txt || true
          cp .delivery/slots/green.env delivery-slot-green.env 2>/dev/null || true
          cp .delivery/last-smoke-green.log delivery-smoke.log 2>/dev/null || true
          df -h / | tee disk-after-delivery-smoke.txt

      - name: Write delivery summary
        if: always()
        env:
          CANDIDATE_IMAGE: ${{ steps.build_image.outputs.candidate_image }}
          BUILD_DURATION_SECONDS: ${{ steps.build_image.outputs.build_duration_seconds }}
          SMOKE_DURATION_SECONDS: ${{ steps.delivery_smoke.outputs.smoke_duration_seconds }}
        run: |
          digest="$(awk -F= '/^DIGEST=/{print $2}' delivery-slot-green.env 2>/dev/null || true)"
          {
            echo "## Delivery smoke simulation (green slot)"
            echo ""
            echo "- Candidate image: \`${CANDIDATE_IMAGE}\`"
            if [ -n "$digest" ]; then
              echo "- Image identity: \`${digest}\`"
            fi
            if [ -n "${BUILD_DURATION_SECONDS}" ]; then
              echo "- Build duration: ${BUILD_DURATION_SECONDS}s"
            fi
            if [ -n "${SMOKE_DURATION_SECONDS}" ]; then
              echo "- Smoke duration: ${SMOKE_DURATION_SECONDS}s"
            fi
            echo ""
            echo "### Disk headroom"
            echo ""
            echo "**Before build**"
            echo '```text'
            if [ -f disk-before-delivery-smoke.txt ]; then cat disk-before-delivery-smoke.txt; else echo "(not captured)"; fi
            echo '```'
            echo ""
            echo "**After build**"
            echo '```text'
            if [ -f disk-after-delivery-build.txt ]; then cat disk-after-delivery-build.txt; else echo "(not captured)"; fi
            echo '```'
            echo ""
            echo "**After smoke**"
            echo '```text'
            if [ -f disk-after-delivery-smoke.txt ]; then cat disk-after-delivery-smoke.txt; else echo "(not captured)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload delivery smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery-compose-ps.txt
            delivery-slot-green.env
            delivery-smoke.log
            disk-before-delivery-smoke.txt
            disk-after-delivery-build.txt
            disk-after-delivery-smoke.txt
          if-no-files-found: error

      - name: Tear down delivery smoke slot
        if: always()
        run: ./scripts/delivery-sim.sh down green --destroy-data

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Opt-in multi-arch dry-run (S5-C). Proves the linux/amd64 + linux/arm64
  # build path on native runners and records manifest/digest, duration, and
  # disk evidence per platform. QEMU emulation was ruled out by evidence: the
  # arm64 leg exceeded a 150-minute timeout under QEMU (run 27291370220 on
  # 2026-06-10), so each platform builds natively (arm64 on ubuntu-24.04-arm,
  # free for public repos). Release publishing stays single-arch; promotion is
  # gated behind roadmap M3/M4 and would assemble a manifest list from these
  # per-platform builds. Independent of the quality gate because it is
  # dispatch-only and publishes nothing; never runs on tag pushes or default
  # dispatches.
  multiarch-dryrun:
    name: Multi-Arch Dry-Run (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_multiarch
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Best-effort: some of these paths exist only on the x64 image.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Capture disk headroom before build
        run: df -h / | tee disk-before-build.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build platform image (no push)
        id: build
        # OCI tarball output keeps the dry run registry-free; provenance/sbom
        # stay disabled to match the CI publish path and keep the output
        # limited to the real platform manifest.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          start="$(date +%s)"
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false \
            --sbom=false \
            --output type=oci,dest=platform-image.tar \
            .
          end="$(date +%s)"
          duration="$((end - start))"
          echo "duration_seconds=${duration}" >> "$GITHUB_OUTPUT"
          echo "Build took ${duration}s"
          df -h / | tee disk-after-build.txt

      - name: Inspect platform manifest
        # Registry-free inspection: walk the OCI layout with jq (preinstalled)
        # and fail unless the expected platform manifest is present. Platform
        # is resolved from the manifest descriptor when present, otherwise
        # from the image config blob (os/architecture).
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p oci-layout
          tar -xf platform-image.tar -C oci-layout

          blob_path() {
            printf 'oci-layout/blobs/%s/%s' "${1%%:*}" "${1#*:}"
          }

          top_media="$(jq -r '.manifests[0].mediaType' oci-layout/index.json)"
          top_digest="$(jq -r '.manifests[0].digest' oci-layout/index.json)"
          case "$top_media" in
            *index*)
              cp "$(blob_path "$top_digest")" manifest-list.json
              ;;
            *)
              cp oci-layout/index.json manifest-list.json
              ;;
          esac

          : > platform-manifests.txt
          while IFS= read -r entry; do
            digest="$(jq -r '.digest' <<<"$entry")"
            os="$(jq -r '.platform.os // empty' <<<"$entry")"
            arch="$(jq -r '.platform.architecture // empty' <<<"$entry")"
            if [ -z "$os" ]; then
              media="$(jq -r '.mediaType' <<<"$entry")"
              case "$media" in
                *manifest*)
                  config_digest="$(jq -r '.config.digest' "$(blob_path "$digest")")"
                  os="$(jq -r '.os' "$(blob_path "$config_digest")")"
                  arch="$(jq -r '.architecture' "$(blob_path "$config_digest")")"
                  ;;
              esac
            fi
            [ -z "$os" ] && continue
            [ "$os" = "unknown" ] && continue
            printf '%s/%s\t%s\n' "$os" "$arch" "$digest" >> platform-manifests.txt
          done < <(jq -c '.manifests[]' manifest-list.json)

          cat platform-manifests.txt
          if ! grep -q "^${EXPECTED_PLATFORM}\b" platform-manifests.txt; then
            echo "Missing expected platform manifest: ${EXPECTED_PLATFORM}" >&2
            exit 1
          fi

      - name: Write dry-run summary
        env:
          PLATFORM: ${{ matrix.platform }}
          DURATION_SECONDS: ${{ steps.build.outputs.duration_seconds }}
        run: |
          {
            echo "## Multi-arch dry-run (${PLATFORM})"
            echo ""
            echo "Build duration: ${DURATION_SECONDS}s"
            echo ""
            echo "| Platform | Digest |"
            echo "| --- | --- |"
            awk -F'\t' '{ printf "| %s | `%s` |\n", $1, $2 }' platform-manifests.txt
            echo ""
            echo "### Disk headroom"
            echo ""
            echo "**Before build**"
            echo '```text'
            cat disk-before-build.txt
            echo '```'
            echo ""
            echo "**After build**"
            echo '```text'
            cat disk-after-build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multiarch-dryrun-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            manifest-list.json
            platform-manifests.txt
            disk-before-build.txt
            disk-after-build.txt
          if-no-files-found: error

      - name: Remove local build outputs
        if: always()
        run: rm -rf platform-image.tar oci-layout

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
