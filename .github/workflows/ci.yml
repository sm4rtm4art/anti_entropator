name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: sm4rtm4art/anti_entropator

jobs:
  # Quick source checks (no heavy compilation)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Test using pre-built container image
  test-container:
    name: Test Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull container image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest || {
            echo "⚠️ No container image found. Push one first with:"
            echo "   ./scripts/build-and-push.sh"
            exit 1
          }

      - name: Smoke test - version
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest --version

      - name: Smoke test - help
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest --help

      - name: Smoke test - profile (with test data)
        run: |
          mkdir -p /tmp/test-data
          echo "test file" > /tmp/test-data/test.txt
          docker run --rm -v /tmp/test-data:/data:ro ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest profile /data
