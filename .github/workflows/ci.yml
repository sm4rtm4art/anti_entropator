name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly coverage trend on main (see the coverage job). Offset from the
    # Security workflow's 02:00 cron so the two heavy workflows do not collide.
    - cron: "0 3 * * 1"

# Markdown-only changes skip the heavy Rust/container jobs via the `changes`
# job below (not workflow-level paths-ignore), so the required "CI Gate" check
# still reports on docs-only PRs instead of never running. Coverage is not a PR
# gate: it runs on pushes to main and on the weekly schedule (see the coverage
# job). Docs/Markdown/shell linting lives in docs-shell.yml.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: sm4rtm4art/anti_entropator

jobs:
  # Cheap path filter: `code` is true unless the change set is Markdown-only.
  # This mirrors the previous `paths-ignore: ['**/*.md']` semantics but as a job,
  # so downstream skips still let the aggregate "CI Gate" report success.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Path filtering only applies to push/PR diffs; the weekly schedule runs the
    # coverage job directly, so change detection is skipped there.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Shared quality gates (fmt, clippy, tests)
  quality:
    name: Quality
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-quality.yml
    with:
      run_lint: true
      run_test: true
      run_audit: false

  # Code coverage via cargo-llvm-cov + Codecov
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Coverage is a main-branch trend signal, not a PR gate: it runs on pushes
    # to main and on the weekly schedule, never on PRs (keeps PR CI fast). It is
    # intentionally decoupled from quality/changes so the scheduled run does not
    # depend on path filtering.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch commit (no version tag)
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Build and push container on main branch
  container:
    name: Build Container
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable attestation to avoid GHCR 403 errors
          provenance: false
          sbom: false

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, quality, coverage, container]
    steps:
      # Aggregator holds no build state, but still checks out (without a
      # persisted git token) so the shared cleanup can wipe any docker login /
      # credentials left on a self-hosted runner this job lands on.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Evaluate dependency outcomes
        run: |
          # quality/coverage/container are intentionally skipped on Markdown-only
          # changes (container off-main, coverage off-PR); 'skipped' is allowed,
          # only failure/cancelled blocks. 'changes' itself is skipped on the
          # weekly schedule (coverage-only run), which is also acceptable.
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            echo "::error::changes completed with '${{ needs.changes.result }}'"
            exit 1
          fi

          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.quality.result }}" == "cancelled" ]]; then
            echo "::error::quality completed with '${{ needs.quality.result }}'"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" == "failure" || "${{ needs.coverage.result }}" == "cancelled" ]]; then
            echo "::error::coverage completed with '${{ needs.coverage.result }}'"
            exit 1
          fi

          if [[ "${{ needs.container.result }}" == "failure" || "${{ needs.container.result }}" == "cancelled" ]]; then
            echo "::error::container completed with '${{ needs.container.result }}'"
            exit 1
          fi

          echo "All required CI dependencies completed successfully."

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
