name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly coverage trend on main (see the coverage job). Offset from the
    # Security workflow's 02:00 cron so the two heavy workflows do not collide.
    - cron: "0 3 * * 1"

# Docs/rules-only changes (*.md / *.mdc) skip the heavy Rust/container jobs via
# the `changes` job below (not workflow-level paths-ignore), so the required
# "CI Gate" check still reports on docs-only PRs instead of never running.
# Coverage is not a PR gate: it runs on pushes to main and on the weekly
# schedule (see the coverage job). Docs/Markdown/shell linting lives in
# docs-shell.yml.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: sm4rtm4art/anti_entropator

jobs:
  # Cheap path filter: `code` is true unless the change set is docs/rules-only
  # (*.md / *.mdc). `predicate-quantifier: every` is required so exclusions bind
  # against `**`; with the default `some`, README.md matched `**` and still set
  # code=true (seen on docs-only PR #161).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Path filtering only applies to push/PR diffs; the weekly schedule runs the
    # coverage job directly, so change detection is skipped there.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # every: a path must match all patterns (so !**/*.md / !**/*.mdc apply).
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdc'

  # Shared quality gates (fmt, clippy, tests)
  quality:
    name: Quality
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-quality.yml
    with:
      run_lint: true
      run_test: true
      run_audit: false

  # Code coverage via cargo-llvm-cov + Codecov
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Coverage is a main-branch trend signal, not a PR gate: it runs on pushes
    # to main and on the weekly schedule, never on PRs (keeps PR CI fast). It is
    # intentionally decoupled from quality/changes so the scheduled run does not
    # depend on path filtering.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip 2026-07-16 (no version tag)
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Build and push container on main branch
  container:
    name: Build Container
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable attestation to avoid GHCR 403 errors
          provenance: false
          sbom: false

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, quality, coverage, container]
    steps:
      # Aggregator holds no build state, but still checks out (without a
      # persisted git token) so the shared cleanup can wipe any docker login /
      # credentials left on a self-hosted runner this job lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate dependency outcomes
        run: |
          # quality/coverage/container are intentionally skipped on docs/rules-only
          # changes (container off-main, coverage off-PR); 'skipped' is allowed,
          # only failure/cancelled blocks. 'changes' itself is skipped on the
          # weekly schedule (coverage-only run), which is also acceptable.
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            echo "::error::changes completed with '${{ needs.changes.result }}'"
            exit 1
          fi

          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.quality.result }}" == "cancelled" ]]; then
            echo "::error::quality completed with '${{ needs.quality.result }}'"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" == "failure" || "${{ needs.coverage.result }}" == "cancelled" ]]; then
            echo "::error::coverage completed with '${{ needs.coverage.result }}'"
            exit 1
          fi

          if [[ "${{ needs.container.result }}" == "failure" || "${{ needs.container.result }}" == "cancelled" ]]; then
            echo "::error::container completed with '${{ needs.container.result }}'"
            exit 1
          fi

          echo "All required CI dependencies completed successfully."

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
