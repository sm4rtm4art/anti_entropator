name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: GitHub Actions Security Analysis
    # Code scanning uploads require a write token; skip fork PRs rather than
    # weakening the workflow with pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  cargo-audit:
    name: Cargo Audit
    permissions:
      contents: read
    uses: ./.github/workflows/rust-quality.yml
    with:
      run_lint: false
      run_test: false
      run_audit: true

  trivy-fs-pr:
    name: Trivy Filesystem Scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare scan output directory
        run: mkdir -p trivy-results

      - name: Trivy filesystem scan (report mode)
        # S5-A report mode: vulnerability findings are logged; scan failures still fail.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy filesystem scan (JSON artifact)
        # Persist machine-readable evidence while keeping table output above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results/trivy-fs-high-critical.json
          exit-code: "0"

      - name: Summarize filesystem scan
        run: |
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results/trivy-fs-high-critical.json)
          {
            echo "### Trivy Filesystem Scan (PR)"
            echo "- Severity scope: HIGH,CRITICAL"
            echo "- Vulnerabilities found: ${total}"
            echo "- Artifact: trivy-fs-high-critical.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload filesystem scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-fs-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results/trivy-fs-high-critical.json
          if-no-files-found: error

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  trivy-image-main-schedule:
    name: Trivy Image Scan (main/schedule/manual)
    # PRs run the filesystem scan above. Use workflow_dispatch on a PR branch
    # when image-scan evidence is needed before merging.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify image security posture
        uses: ./.github/actions/container-verify
        with:
          image-tag: anti_entropator:local-scan
          severity: HIGH,CRITICAL
          artifact-name: trivy-image-main-schedule-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  # Stable aggregator: the single required status check for this workflow, so
  # branch protection survives job renames. Require BOTH "CI Gate" (ci.yml) and
  # this "Security Gate". Fails on failure/cancelled; intentional skips are OK.
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [workflow-security, cargo-audit, trivy-fs-pr, trivy-image-main-schedule]
    steps:
      # Aggregator holds no build state, but still checks out (without a
      # persisted git token) so the shared cleanup can wipe any docker login /
      # credentials left on a self-hosted runner this job lands on.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Evaluate security dependency outcomes
        run: |
          # Fork PRs intentionally skip workflow-security (zizmor / code scanning)
          # because security-events: write is unavailable to forks; trivy-fs-pr is
          # PR-only and trivy-image-main-schedule is push/schedule/dispatch-only.
          # 'skipped' is therefore allowed; only failure/cancelled blocks merge.
          if [[ "${{ needs.workflow-security.result }}" == "failure" || "${{ needs.workflow-security.result }}" == "cancelled" ]]; then
            echo "::error::workflow-security completed with '${{ needs.workflow-security.result }}'"
            exit 1
          fi

          if [[ "${{ needs.cargo-audit.result }}" == "failure" || "${{ needs.cargo-audit.result }}" == "cancelled" ]]; then
            echo "::error::cargo-audit completed with '${{ needs.cargo-audit.result }}'"
            exit 1
          fi

          if [[ "${{ needs.trivy-fs-pr.result }}" == "failure" || "${{ needs.trivy-fs-pr.result }}" == "cancelled" ]]; then
            echo "::error::trivy-fs-pr completed with '${{ needs.trivy-fs-pr.result }}'"
            exit 1
          fi

          if [[ "${{ needs.trivy-image-main-schedule.result }}" == "failure" || "${{ needs.trivy-image-main-schedule.result }}" == "cancelled" ]]; then
            echo "::error::trivy-image-main-schedule completed with '${{ needs.trivy-image-main-schedule.result }}'"
            exit 1
          fi

          echo "All required security checks passed or were intentionally skipped."

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
