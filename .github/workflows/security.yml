name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  trivy-fs-pr:
    name: Trivy Filesystem Scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # S5-A is visibility-first: keep findings visible without blocking PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan (report mode)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-image-main-schedule:
    name: Trivy Image Scan (main/schedule/manual)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # S5-A is visibility-first: keep findings visible without failing runs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Build local image for scan
        run: docker build -t anti_entropator:s5a-scan .

      - name: Trivy image scan (report mode)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: anti_entropator:s5a-scan
          severity: HIGH,CRITICAL
          exit-code: "1"
