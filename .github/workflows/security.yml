name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: GitHub Actions Security Analysis
    # Code scanning uploads require a write token; skip fork PRs rather than
    # weakening the workflow with pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch commit (no version tag)

      - name: Install cargo-audit
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  trivy-fs-pr:
    name: Trivy Filesystem Scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare scan output directory
        run: mkdir -p trivy-results

      - name: Trivy filesystem scan (report mode)
        # S5-A report mode: vulnerability findings are logged; scan failures still fail.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy filesystem scan (JSON artifact)
        # Persist machine-readable evidence while keeping table output above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results/trivy-fs-high-critical.json
          exit-code: "0"

      - name: Summarize filesystem scan
        run: |
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results/trivy-fs-high-critical.json)
          {
            echo "### Trivy Filesystem Scan (PR)"
            echo "- Severity scope: HIGH,CRITICAL"
            echo "- Vulnerabilities found: ${total}"
            echo "- Artifact: trivy-fs-high-critical.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload filesystem scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-fs-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results/trivy-fs-high-critical.json
          if-no-files-found: error

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh

  trivy-image-main-schedule:
    name: Trivy Image Scan (main/schedule/manual)
    # PRs run the filesystem scan above. Use workflow_dispatch on a PR branch
    # when image-scan evidence is needed before merging.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare scan output directory
        run: mkdir -p trivy-results

      - name: Build local image for scan
        run: docker build --pull -t anti_entropator:local-scan .

      - name: Smoke test runtime image
        run: docker run --rm anti_entropator:local-scan --help

      - name: Trivy image scan (report mode)
        # S5-A report mode: vulnerability findings are logged; scan failures still fail.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: anti_entropator:local-scan
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy image scan (JSON artifact)
        # Persist machine-readable evidence while keeping table output above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: anti_entropator:local-scan
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results/trivy-image-high-critical.json
          exit-code: "0"

      - name: Trivy image scan (fixable-only JSON artifact)
        # Enforcement input: the later policy step fails if this JSON contains findings.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: anti_entropator:local-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results/trivy-image-fixable-high-critical.json
          exit-code: "0"

      - name: Summarize image scans
        run: |
          baseline_total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results/trivy-image-high-critical.json)
          fixable_total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results/trivy-image-fixable-high-critical.json)
          {
            echo "### Trivy Image Scan (main/schedule/manual)"
            echo "- Baseline scope: HIGH,CRITICAL (report mode)"
            echo "- Baseline vulnerabilities: ${baseline_total}"
            echo "- Fixable-only vulnerabilities: ${fixable_total}"
            echo "- Artifacts: trivy-image-high-critical.json, trivy-image-fixable-high-critical.json"
            echo ""
            echo "#### Baseline HIGH/CRITICAL findings"
            if [ "${baseline_total}" -eq 0 ]; then
              echo "No baseline HIGH/CRITICAL findings."
            else
              echo "| Vulnerability | Severity | Package | Installed | Fixed |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName // "-") | \(.InstalledVersion // "-") | \(.FixedVersion // "-") |"' trivy-results/trivy-image-high-critical.json
            fi
            echo ""
            echo "#### Fixable HIGH/CRITICAL findings"
            if [ "${fixable_total}" -eq 0 ]; then
              echo "No fixable HIGH/CRITICAL findings."
            else
              echo "| Vulnerability | Severity | Package | Installed | Fixed |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName // "-") | \(.InstalledVersion // "-") | \(.FixedVersion // "-") |"' trivy-results/trivy-image-fixable-high-critical.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image scan artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-main-schedule-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trivy-results/trivy-image-high-critical.json
            trivy-results/trivy-image-fixable-high-critical.json
          if-no-files-found: error

      - name: Enforce fixable HIGH/CRITICAL policy
        run: |
          fixable_total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results/trivy-image-fixable-high-critical.json)
          if [ "${fixable_total}" -gt 0 ]; then
            echo "::error::Found ${fixable_total} fixable HIGH/CRITICAL image vulnerabilities."
            exit 1
          fi

      - name: Clean runner workspace
        if: always()
        run: ./scripts/ci-cleanup.sh
