name: Work Block
description: Track a block of work that ships as several small PRs
title: "[tracking] "
labels:
  - tracking
body:
  - type: input
    id: block
    attributes:
      label: Block
      description: Short name or identifier for this block of work.
      placeholder: "M1.1 shared inspect stage"
    validations:
      required: true

  - type: input
    id: plan-source
    attributes:
      label: Plan Source
      description: Link or path to the plan, ADR, or issue this block comes from.
      placeholder: "docs/adr/ADR-009-... or issue link"

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What does this block change for users or maintainers?
      placeholder: |
        - User-facing contract:
        - Technical debt removed:
        - Deferred scope:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Keep the block bounded and reviewable.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: sub-blocks
    attributes:
      label: PR Checklist
      description: List the planned PRs. Note stacking order when one depends on another.
      placeholder: |
        - [ ] <slice> - PR #
        - [ ] <slice> - PR # (stacked on the previous one)

  - type: textarea
    id: validation
    attributes:
      label: Validation Evidence
      description: Record commands, CI links, or reasons validation was deferred.
      placeholder: |
        - fmt / clippy / tests / audit:
        - coverage, if applicable:

  - type: textarea
    id: deferred
    attributes:
      label: Deferred Follow-ups
      description: Record explicit follow-ups instead of leaving open-ended debt.
      placeholder: |
        - Item:
          Reason:
          Next step:
