version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Stack groups first: a dependency matching multiple groups is only
      # assigned to one group (first match). Keep coordinated majors/minors
      # for the deferred OpenDAL / DataFusion / Iceberg lines together.
      opendal-stack:
        patterns:
          - "opendal"
          - "object_store_opendal"
          - "object_store"
      datafusion-stack:
        patterns:
          - "datafusion"
          - "arrow"
          - "parquet"
          - "iceberg-datafusion"
      iceberg-core:
        patterns:
          - "iceberg"
          - "iceberg-catalog-rest"
          - "iceberg-storage-opendal"
      # Catch-all for everything else: one weekly PR for clap/anyhow/serde/…
      # instead of N separate CI runs. Stack crates above stay in their groups.
      cargo-patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      # Without an explicit major group, some major bumps that match `*` can be
      # dropped instead of falling through to individual PRs
      # (dependabot-core#14202). Stack majors remain governed by `ignore` below.
      cargo-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Deferred until DataFusion line can consume object_store/opendal major updates.
      - dependency-name: "opendal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "object_store_opendal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "object_store"
        update-types:
          - "version-update:semver-major"
      # Deferred until digest/hmac stack is upgraded together.
      - dependency-name: "sha2"
        update-types:
          - "version-update:semver-major"
      # Deferred until an aligned Iceberg/DataFusion line is available.
      - dependency-name: "datafusion"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "arrow"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "iceberg-datafusion"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      ci-core-actions:
        patterns:
          - "actions/checkout"
          - "actions/cache"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "codecov/codecov-action"
          - "dtolnay/rust-toolchain"
          - "taiki-e/install-action"
          - "softprops/action-gh-release"
          - "zizmorcore/zizmor-action"
          - "dorny/paths-filter"
      ci-docker-actions:
        patterns:
          - "docker/setup-buildx-action"
          - "docker/login-action"
          - "docker/metadata-action"
          - "docker/build-push-action"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      container-base-images:
        patterns:
          - "rust"
          - "debian"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      compose-service-images:
        patterns:
          - "rustfs/rustfs"
          - "postgres"
          - "quay.io/lakekeeper/catalog"
