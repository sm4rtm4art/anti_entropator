version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      opendal-stack:
        patterns:
          - "opendal"
          - "object_store_opendal"
          - "object_store"
      datafusion-stack:
        patterns:
          - "datafusion"
          - "arrow"
          - "parquet"
          - "iceberg-datafusion"
      iceberg-core:
        patterns:
          - "iceberg"
          - "iceberg-catalog-rest"
          - "iceberg-storage-opendal"
    ignore:
      # Deferred until DataFusion line can consume object_store/opendal major updates.
      - dependency-name: "opendal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "object_store_opendal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "object_store"
        update-types:
          - "version-update:semver-major"
      # Deferred until digest/hmac stack is upgraded together.
      - dependency-name: "sha2"
        update-types:
          - "version-update:semver-major"
      # Deferred until an aligned Iceberg/DataFusion line is available.
      - dependency-name: "datafusion"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "arrow"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "iceberg-datafusion"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      ci-core-actions:
        patterns:
          - "actions/checkout"
          - "actions/cache"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "codecov/codecov-action"
          - "dtolnay/rust-toolchain"
          - "taiki-e/install-action"
          - "softprops/action-gh-release"
          - "zizmorcore/zizmor-action"
      ci-docker-actions:
        patterns:
          - "docker/setup-buildx-action"
          - "docker/login-action"
          - "docker/metadata-action"
          - "docker/build-push-action"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      container-base-images:
        patterns:
          - "rust"
          - "debian"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      compose-service-images:
        patterns:
          - "rustfs/rustfs"
          - "postgres"
          - "quay.io/lakekeeper/catalog"
