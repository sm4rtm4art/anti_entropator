# Anti-Entropator Local Lakehouse Stack
#
# Services:
#   - RustFS: S3-compatible object storage (MinIO replacement)
#   - Lakekeeper: Apache Iceberg REST Catalog (Rust, no JVM)
#   - Postgres: Backend for Lakekeeper catalog state
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Security note:
#   - Ports are bound to ${ANTI_BIND_HOST:-127.0.0.1} by default (local-only).
#   - Do not set ANTI_BIND_HOST=0.0.0.0 without a reviewed deployment profile.
#
# Storage note:
#   - RustFS data lives in the named volume `rustfs-data`, not a bind mount.
#     RustFS 1.0.0 requires a direct-attached POSIX filesystem; Docker Desktop
#     bind mounts (FUSE/virtiofs on macOS) fail its durable-rename path with
#     EBADF (verified 2026-09-17). Named volumes are ext4 inside the VM.
#   - Postgres keeps a bind mount at ./data/postgres; RustFS logs at ./logs/rustfs.
#   - RustFS runs as UID 10001; the named volume inherits image ownership, so
#     only the log directory needs `chown -R 10001:10001 logs/rustfs`.
#   - Reset everything: `docker compose down -v && rm -rf data/postgres`.

name: anti_entropator

x-lakekeeper-db: &lakekeeper-db
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?set_in_.env}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?set_in_.env}@postgres:5432/${POSTGRES_DB:-lakekeeper}
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?set_in_.env}@postgres:5432/${POSTGRES_DB:-lakekeeper}

services:
  # S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "${ANTI_BIND_HOST:-127.0.0.1}:${RUSTFS_API_PORT:-8200}:9000" # S3 API (Organized port)
      - "${ANTI_BIND_HOST:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-8210}:9001" # Web Console (Organized port)
    volumes:
      - rustfs-data:/data
      - ./logs/rustfs:/logs
    environment:
      # RustFS uses ACCESS_KEY/SECRET_KEY variable names.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set_in_.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set_in_.env}
    healthcheck:
      # /health is liveness only: it returned 200 while 1.0.0 was stuck in a
      # store-init restart loop (2026-09-17). /health/ready reflects storage
      # quorum and is what S3 clients need; it exists on 1.0.0-beta.2 and 1.0.0.
      test:
        [
          "CMD-SHELL",
          'CODE=$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9000/health/ready); [ "$$CODE" = "200" ]',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Postgres backend for Lakekeeper catalog
  postgres:
    image: postgres:18.6-alpine3.23
    ports:
      - "${ANTI_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-8300}:5432" # Postgres (Organized port)
    volumes:
      # Postgres 18 stores data in a version subdirectory, so mount the parent
      # (not /var/lib/postgresql/data). Wipe a pre-18 ./data/postgres first.
      - ./data/postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_.env}
      POSTGRES_DB: ${POSTGRES_DB:-lakekeeper}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lakekeeper} -d ${POSTGRES_DB:-lakekeeper}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Lakekeeper catalog (Apache Iceberg REST Catalog)
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.5
    environment:
      <<: *lakekeeper-db
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.5
    ports:
      - "${ANTI_BIND_HOST:-127.0.0.1}:${LAKEKEEPER_PORT:-8100}:8181" # REST API + UI (Organized port)
    environment:
      <<: *lakekeeper-db
      # "allowall" is for local development only. Override in shared/public environments.
      LAKEKEEPER__AUTHZ_BACKEND: ${LAKEKEEPER_AUTHZ_BACKEND:-allowall}
      RUST_LOG: info,lakekeeper=info,sqlx=warn
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  rustfs-data:

networks:
  default:
    driver: bridge
