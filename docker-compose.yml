# Anti-Entropator Local Lakehouse Stack
#
# Services:
#   - RustFS: S3-compatible object storage (MinIO replacement)
#   - Lakekeeper: Apache Iceberg REST Catalog (Rust, no JVM)
#   - Postgres: Backend for Lakekeeper catalog state
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Security note:
#   - Ports are bound to 127.0.0.1 by default (local-only).
#
# Note: RustFS runs as non-root user (UID 10001).
# Volume directories must have correct permissions:
#   mkdir -p data/rustfs logs/rustfs data/postgres
#   chown -R 10001:10001 data/rustfs logs/rustfs

services:
  # S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: anti_entropator_rustfs
    ports:
      - "127.0.0.1:8200:9000" # S3 API (Organized port)
      - "127.0.0.1:8210:9001" # Web Console (Organized port)
    volumes:
      - ./data/rustfs:/data
      - ./logs/rustfs:/logs
    environment:
      # RustFS uses ACCESS_KEY/SECRET_KEY (not MinIO's MINIO_ROOT_*).
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-antiuser}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-antipassword}
    healthcheck:
      # RustFS returns 403 for this endpoint without auth; treat 200/403 as healthy.
      test:
        [
          "CMD-SHELL",
          'CODE=$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9000/minio/health/live); [ "$$CODE" = "200" ] || [ "$$CODE" = "403" ]',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Postgres backend for Lakekeeper catalog
  postgres:
    image: postgres:16.11-alpine3.23
    container_name: anti_entropator_postgres
    ports:
      - "127.0.0.1:8300:5432" # Postgres (Organized port)
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakekeeper}
      POSTGRES_DB: ${POSTGRES_DB:-lakekeeper}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lakekeeper} -d ${POSTGRES_DB:-lakekeeper}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Lakekeeper catalog (Apache Iceberg REST Catalog)
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.10.4
    container_name: anti_entropator_lakekeeper_migrate
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:-This-is-NOT-Secure!}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/${POSTGRES_DB:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/${POSTGRES_DB:-lakekeeper}
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.10.4
    container_name: anti_entropator_lakekeeper
    ports:
      - "127.0.0.1:8100:8181" # REST API + UI (Organized port)
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:-This-is-NOT-Secure!}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/${POSTGRES_DB:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/${POSTGRES_DB:-lakekeeper}
      # Allow anonymous access for development (disable authorization)
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      RUST_LOG: info,lakekeeper=info,sqlx=warn
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
